<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | VIP Manager</title>
    
    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --vip-primary: #6366f1;
            --vip-secondary: #8b5cf6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #0f172a url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            position: relative; overflow: hidden;
        }

        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.5) 100%);
            z-index: 0;
        }

        .login-container {
            position: relative; z-index: 1; width: 100%; max-width: 450px; padding: 20px;
            animation: loginSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes loginSlideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: white; text-align: center;
        }

        .brand-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--vip-primary), var(--vip-secondary));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        .brand-name {
            font-size: 1.8rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .login-subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 40px; }

        .form-floating-vip { position: relative; margin-bottom: 24px; text-align: left; }
        .form-floating-vip i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        .form-control-vip {
            width: 100%; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 14px 20px 14px 52px;
            color: white; font-size: 0.95rem; transition: all 0.3s;
        }

        .form-control-vip:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--vip-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-login-vip {
            width: 100%; background: linear-gradient(135deg, var(--vip-primary), var(--vip-secondary));
            border: none; border-radius: 16px; padding: 16px;
            color: white; font-weight: 700; font-size: 1rem;
            transition: all 0.3s; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-login-vip:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-logo"><i class="fas fa-key"></i></div>
            <h1 class="brand-name">MẬT KHẨU MỚI</h1>
            <p class="login-subtitle">Vui lòng thiết lập lại mật khẩu an toàn cho tài khoản của bạn</p>

            <form id="resetForm">
                <input type="hidden" id="token" th:value="${token}">
                
                <div class="form-floating-vip">
                    <input type="password" id="newPassword" class="form-control-vip" placeholder="Mật khẩu mới" required>
                    <i class="fas fa-lock"></i>
                </div>

                <div class="form-floating-vip">
                    <input type="password" id="confirmPassword" class="form-control-vip" placeholder="Xác nhận mật khẩu" required>
                    <i class="fas fa-shield-alt"></i>
                </div>

                <button type="submit" class="btn-login-vip" id="submitBtn">
                    CẬP NHẬT MẬT KHẨU <i class="fas fa-check-circle ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const token = document.getElementById('token').value || new URLSearchParams(window.location.search).get('token');
            
            if (pass !== confirm) {
                return Swal.fire({ icon: 'warning', title: 'Lỗi', text: 'Mật khẩu xác nhận không khớp!', background: '#1e293b', color: '#fff' });
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG CẬP NHẬT...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: pass })
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Thành công!',
                        text: 'Mật khẩu của bạn đã được thay đổi. Hãy đăng nhập lại.',
                        confirmButtonColor: '#6366f1',
                        background: '#1e293b', color: '#fff'
                    }).then(() => {
                        window.location.href = '/login';
                    });
                } else {
                    const data = await response.json();
                    throw new Error(data.detail || 'Token không hợp lệ hoặc đã hết hạn');
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi',
                    text: err.message,
                    confirmButtonColor: '#ef4444',
                    background: '#1e293b', color: '#fff'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'CẬP NHẬT MẬT KHẨU <i class="fas fa-check-circle ms-2"></i>';
            }
        });
    </script>
</body>
</html>
