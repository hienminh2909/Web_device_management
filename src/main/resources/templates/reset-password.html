<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | NEOCORE VIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-surface: #f8fafc;
            --primary: #0f766e;
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --font-body: 'Inter', sans-serif;
            --font-display: 'Space Mono', monospace;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg-surface);
            font-family: var(--font-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(15, 118, 110, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(15, 118, 110, 0.05), transparent 40%);
            z-index: -1;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: var(--shadow-card);
            border: var(--glass-border);
            backdrop-filter: blur(20px);
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header { margin-bottom: 40px; text-align: center; }
        
        .brand-logo-container {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 2rem;
        }

        .brand-title {
            font-family: var(--font-display);
            font-weight: 800; font-size: 2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; letter-spacing: -1px;
        }

        .brand-subtitle {
            color: var(--text-muted); font-size: 0.85rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; margin-top: 5px;
        }

        .form-label {
            font-size: 0.75rem; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; display: block; padding-left: 5px;
        }

        .input-group-vip { margin-bottom: 24px; }

        .form-control {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 1rem 1.25rem; color: var(--text-main) !important;
            font-weight: 600; font-family: var(--font-body);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            background: #ffffff !important;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
            outline: none;
        }

        .btn-vip {
            background: var(--primary-gradient);
            color: #ffffff; border: none; border-radius: 16px;
            padding: 16px; font-weight: 800; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s; width: 100%;
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.25);
            font-family: var(--font-body); margin-top: 10px;
        }

        .btn-vip:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(15, 118, 110, 0.35); }
        .btn-vip:disabled { opacity: 0.7; transform: translateY(0); box-shadow: none; cursor: not-allowed; }

        .alert-error {
            background: #fff1f2; color: #e11d48;
            border: 1px solid #fecdd3; border-radius: 12px;
            padding: 12px; font-size: 0.8rem; font-weight: 700;
            margin-bottom: 20px; text-align: center;
        }

        .forgot-link {
            display: inline-block; margin-top: 25px;
            color: var(--text-muted); text-decoration: none;
            font-size: 0.85rem; font-weight: 700; transition: all 0.2s;
        }
        .forgot-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="glass-card">
        <div class="brand-header">
            <div class="brand-logo-container">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="brand-title">NEOCORE</h1>
            <p class="brand-subtitle">Cập Nhật Mật Mã</p>
        </div>

        <div th:if="${error}" class="alert-error">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form id="resetForm">
            <input type="hidden" id="token" th:value="${token}">
            
            <div class="input-group-vip">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required autofocus>
            </div>

            <button type="submit" class="btn-vip" id="submitBtn">
                CẬP NHẬT <i class="fas fa-check-circle ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="forgot-link"><i class="fas fa-arrow-left me-2"></i> QUAY LẠI ĐĂNG NHẬP</a>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('submitBtn');

            if (newPassword.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Lỗi bảo mật',
                    text: 'Mật khẩu phải dài ít nhất 6 ký tự',
                    confirmButtonColor: '#0f766e',
                    customClass: { popup: 'rounded-4' }
                });
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG XỬ LÝ...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });
                
                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Hoàn tất',
                        text: 'Mật khẩu đã được cập nhật thành công.',
                        confirmButtonColor: '#0f766e',
                        customClass: { popup: 'rounded-4' }
                    }).then(() => {
                        window.location.href = '/login';
                    });
                } else {
                    const data = await res.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'Thất bại',
                        text: data.detail || 'Token không hợp lệ hoặc đã hết hạn.',
                        confirmButtonColor: '#e11d48',
                        customClass: { popup: 'rounded-4' }
                    });
                }
            } catch (err) {
                Swal.fire('Lỗi', 'Không thể kết nối máy chủ', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'CẬP NHẬT <i class="fas fa-check-circle ms-2"></i>';
            }
        });
    </script>
</div>

</body>
</html>
