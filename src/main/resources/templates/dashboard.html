        /* --- Navbar VIP --- */
        .navbar-vip {
            position: fixed; top: 20px; left: calc(var(--sidebar-width) + 20px); right: 20px;
            z-index: 1030; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            border: var(--glass-border);
            animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- Floating Sidebar VIP --- */
        .sidebar-vip {
            position: fixed; top: 20px; left: 20px; bottom: 20px;
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 30px 20px;
            display: flex; flex-direction: column;
            z-index: 1030;
            box-shadow: var(--shadow-md, 0 10px 30px -5px rgba(0, 0, 0, 0.08));
            border: var(--glass-border);
            animation: slideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-vip::-webkit-scrollbar { width: 4px; }
        .sidebar-vip::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .sidebar-logo {
            margin-bottom: 30px; padding-left: 15px;
            font-family: var(--font-display);
            font-weight: 800; font-size: 1.6rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .nav-group-label {
            font-size: 0.65rem; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1.5px;
            margin: 25px 0 10px 15px;
        }

        .nav-link {
            padding: 14px 20px;
            margin: 6px 0;
            border-radius: 16px;
            color: #64748b;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: transparent;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .nav-link i { font-size: 1.2rem; transition: transform 0.2s; width: 24px; text-align: center; }
        
        .nav-link:hover {
            color: var(--primary);
            background: rgba(248, 250, 252, 0.8);
            transform: translateX(6px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .nav-link.active {
            color: #ffffff;
            background: var(--primary-gradient);
            font-weight: 800;
            border: 1px solid rgba(15, 118, 110, 0.1);
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
            transform: translateY(-2px);
        }
        
        .nav-link.active i { color: #ffffff; }

        /* --- Main Content --- */
        .main-content {
            margin-left: var(--sidebar-width);
            margin-top: 100px;
            padding: 20px 40px 40px 40px;
            min-height: calc(100vh - 100px);
            width: calc(100% - var(--sidebar-width));
            transition: all 0.3s ease;
        }

        .content-canvas {
            width: 100%;
            animation: fadeInCanvas 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeInCanvas {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* User Profile */
        .user-profile-btn {
            display: flex; align-items: center; gap: 12px;
            background: transparent;
            padding: 6px 12px; border-radius: 16px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .user-profile-btn:hover { background: #f1f5f9; border-color: #e2e8f0; }

        .dropdown-menu {
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(20px);
            border: var(--glass-border) !important;
            box-shadow: var(--shadow-lg) !important;
            border-radius: 16px !important;
            padding: 8px !important;
        }
        .dropdown-item {
            color: var(--text-main) !important;
            font-family: var(--font-body);
            font-weight: 600;
            border-radius: 10px;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        .dropdown-item:hover {
            background: #f1f5f9 !important;
            color: var(--primary) !important;
            transform: translateX(4px);
        }

        /* Overrides */
        .bg-white { background-color: var(--bg-card) !important; }
        .text-dark { color: var(--text-main) !important; }
        
        /* Badge Pulse Animation */
        .badge-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
    </style>
</head>
<body>

<div class="sidebar-vip">
    <div class="sidebar-logo d-flex align-items-center gap-3 mb-4" style="padding-left: 5px;">
        <img src="/images/logo.png" style="height: 54px; width: 54px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));" alt="HCM-UTE Logo" />
        <span style="font-family: var(--font-display); font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.4rem; letter-spacing: -0.5px; white-space: nowrap;">HCM-UTE.EQUIP</span>
    </div>
    
    <div class="nav-group-label">Hệ thống</div>
    <a href="/dashboard" class="nav-link" th:classappend="${view == null ? 'active' : ''}">
        <i class="fas fa-chart-pie"></i> Tổng quan
    </a>
    <a href="/notifications" class="nav-link" th:classappend="${view == 'notification_list' ? 'active' : ''}">
        <i class="fas fa-bell"></i> Thông báo
        <span id="sidebarNotifBadge" class="badge rounded-pill ms-auto d-none badge-pulse" style="background: var(--danger);">0</span>
    </a>

    <div class="nav-group-label">Quản lý</div>
    <a href="/devices/list" class="nav-link" th:classappend="${view == 'device_list' ? 'active' : ''}">
        <i class="fas fa-boxes-stacked"></i> Thiết bị
    </a>
    <a href="/rooms" class="nav-link" th:classappend="${view == 'room_list' ? 'active' : ''}" th:if="${session.role == 'admin'}">
        <i class="fas fa-door-open"></i> Phòng học
    </a>
    <a href="/categories" class="nav-link" th:classappend="${view == 'category_list' ? 'active' : ''}" th:if="${session.role == 'admin'}">
        <i class="fas fa-tags"></i> Danh mục
    </a>
    <a href="/users" class="nav-link" th:classappend="${view == 'user_list' ? 'active' : ''}" th:if="${session.role == 'admin'}">
        <i class="fas fa-users-cog"></i> Nhân sự
    </a>

    <div class="nav-group-label">Vận hành</div>
    <a href="/inventory/progress" class="nav-link" th:classappend="${view == 'inventory_progress' || view == 'inventory_details' ? 'active' : ''}">
        <i class="fas fa-qrcode"></i> Kiểm kê
    </a>
    <a href="/requests" class="nav-link" th:classappend="${view == 'request_list' ? 'active' : ''}">
        <i class="fas fa-clipboard-list"></i> Báo cáo
        <span id="sidebarRequestBadge" class="badge rounded-pill ms-auto d-none badge-pulse" style="background: var(--danger);">0</span>
    </a>
    <a href="/reports" class="nav-link" th:classappend="${view == 'inventory_logs' ? 'active' : ''}">
        <i class="fas fa-history"></i> Nhật ký
    </a>
</div>

<nav class="navbar-vip">
    <div class="d-flex align-items-center gap-2">
        <span class="small" style="color: #94a3b8; font-weight: 700; letter-spacing: 1px;">PATH //</span>
        <span class="fw-bold" style="color: var(--primary); text-transform: uppercase; font-family: var(--font-display);" th:text="${view ?: 'Overview'}">Overview</span>
    </div>

    <div class="d-flex align-items-center gap-4">
        <div class="dropdown">
            <div class="user-profile-btn" data-bs-toggle="dropdown" style="cursor: pointer;">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold text-dark" style="font-size: 0.85rem;" th:text="${session.name}">Admin User</div>
                    <div style="font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--primary);" th:text="${session.role}">ADMIN</div>
                </div>
                <div style="width: 36px; height: 36px; border-radius: 12px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(15, 118, 110, 0.2);">
                    <i class="fas fa-user-shield" style="color: var(--primary);"></i>
                </div>
            </div>
            <ul class="dropdown-menu dropdown-menu-end mt-3">
                <li><a class="dropdown-item mb-1" href="/settings"><i class="fas fa-cog me-2"></i>Cài đặt</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="/login?logout" style="color: var(--danger) !important;"><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="content-canvas">
        <div th:replace="~{${view == null ? 'overview' : view} :: content}"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- GLOBAL THEME ENGINE ---
    window.applyTheme = function() {
        const darkMode = localStorage.getItem('darkMode') === 'true';
        const primaryColor = localStorage.getItem('primaryColor') || '#0f766e';
        
        // Apply Dark Mode
        if (darkMode) {
            document.body.classList.add('dark-mode');
        } else {
            document.body.classList.remove('dark-mode');
        }
        
        // Apply Primary Color
        document.documentElement.style.setProperty('--primary', primaryColor);
        document.documentElement.style.setProperty('--primary-gradient', `linear-gradient(135deg, ${primaryColor}, ${primaryColor}dd)`);
    };

    // Run theme engine immediately to prevent flicker
    applyTheme();

    // Global Date Formatter
    window.formatVietnamTime = function() {
        const fullDateEls = document.querySelectorAll('.format-date-full');
        const shortDateEls = document.querySelectorAll('.format-date');

        const optionsFull = { 
            timeZone: 'Asia/Ho_Chi_Minh',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        };
        const optionsShort = { 
            timeZone: 'Asia/Ho_Chi_Minh',
            year: 'numeric', month: '2-digit', day: '2-digit'
        };

        fullDateEls.forEach(el => {
            const raw = el.getAttribute('data-date') || el.innerText.trim();
            if (raw && raw !== '--' && !el.classList.contains('formatted')) {
                const date = new Date(raw);
                if (!isNaN(date.getTime())) {
                    el.innerText = date.toLocaleString('vi-VN', optionsFull);
                    el.classList.add('formatted');
                }
            }
        });

        shortDateEls.forEach(el => {
            const raw = el.getAttribute('data-date') || el.innerText.trim();
            if (raw && raw !== '--' && !el.classList.contains('formatted')) {
                const date = new Date(raw);
                if (!isNaN(date.getTime())) {
                    el.innerText = date.toLocaleDateString('vi-VN', optionsShort);
                    el.classList.add('formatted');
                }
            }
        });
    };

    async function updateBadges() {
        try {
            const notifRes = await fetch('/api/dashboard/unread-notifications-count');
            const notifData = await notifRes.json();
            const notifBadge = document.getElementById('sidebarNotifBadge');
            if (notifData.count > 0) {
                notifBadge.innerText = notifData.count;
                notifBadge.classList.remove('d-none');
            } else {
                notifBadge.classList.add('d-none');
            }

            const reqRes = await fetch('/api/dashboard/pending-requests-count');
            const reqData = await reqRes.json();
            const reqBadge = document.getElementById('sidebarRequestBadge');
            if (reqData.count > 0) {
                reqBadge.innerText = reqData.count;
                reqBadge.classList.remove('d-none');
            } else {
                reqBadge.classList.add('d-none');
            }
        } catch (err) {
            console.error("Badge update failed", err);
        }
    }
    document.addEventListener('DOMContentLoaded', () => {
        updateBadges();
        window.formatVietnamTime();
    });
    setInterval(updateBadges, 30000);
</script>
</body>
</html>
