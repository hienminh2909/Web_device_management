<div th:fragment="content" class="animate__animated animate__fadeIn">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ===== VIP PRO REPORT HISTORY V2 ===== */
        .history-wrapper {
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-family: var(--font-body);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Header --- */
        .header-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(248,250,252,0.7) 100%);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 40px;
            margin-bottom: 30px;
            border: var(--glass-border);
            box-shadow: var(--shadow-md);
        }

        /* --- Search & Stats --- */
        .filter-bar-vip {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 15px 25px;
            margin-bottom: 30px;
            border: var(--glass-border);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: var(--shadow-sm);
        }

        .search-input-vip {
            background: transparent !important;
            border: none !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            color: var(--text-main) !important;
            padding: 10px 0 !important;
            flex-grow: 1;
        }
        .search-input-vip:focus { outline: none; box-shadow: none !important; }

        /* --- Table Card --- */
        .history-card-vip {
            background: #ffffff;
            border-radius: 32px;
            border: 1px solid #eef2f6;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .smart-table thead th {
            background: #f8fafc;
            padding: 20px 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            color: #64748b;
            border-bottom: 1px solid #edf2f7;
        }

        .smart-table tbody td {
            padding: 22px 25px;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
        }

        .history-row { transition: all 0.2s; cursor: pointer; }
        .history-row:hover { background: #fcfdfe; }

        .history-badge-vip {
            padding: 6px 14px; border-radius: 10px; font-weight: 800; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.5px;
            background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;
        }
        .bg-status-tot { background: #f0fdf4 !important; color: #166534 !important; border-color: #bbf7d0 !important; }
        .bg-status-hong { background: #fef2f2 !important; color: #991b1b !important; border-color: #fecaca !important; }
        .bg-status-baotri { background: #fffbeb !important; color: #b45309 !important; border-color: #fef3c7 !important; }
        .bg-status-dangbaotri { background: #ecfeff !important; color: #0e7490 !important; border-color: #cffafe !important; }

        .avatar-mini-vip {
            width: 32px; height: 32px; border-radius: 10px;
            background: #f1f5f9; color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.75rem;
        }

        .btn-export-vip {
            background: var(--primary-gradient); color: #fff;
            padding: 12px 28px; border-radius: 16px; border: none;
            font-weight: 800; font-size: 0.9rem; letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.2);
            transition: all 0.3s;
        }
        .btn-export-vip:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(15, 118, 110, 0.3); color: #fff; }
    </style>

    <div class="history-wrapper container-fluid p-0 pb-5">
        
        <!-- HEADER -->
        <div class="header-glass d-flex justify-content-between align-items-center flex-wrap gap-4">
            <div>
                <h2 class="fw-bold mb-1" style="font-family: var(--font-display); letter-spacing: -1.5px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem;">LỊCH SỬ SỰ CỐ</h2>
                <p class="text-muted fw-semibold small m-0">Toàn bộ hồ sơ thiết bị đã được phê duyệt xử lý.</p>
            </div>
            <button class="btn btn-export-vip" onclick="exportHistoryExcel()">
                <i class="fas fa-file-excel me-2"></i> XUẤT BÁO CÁO CHI TIẾT
            </button>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar-vip animate__animated animate__fadeIn">
            <div class="d-flex align-items-center gap-3 flex-grow-1">
                <i class="fas fa-search text-muted fs-5"></i>
                <input type="text" id="historySearch" class="form-control search-input-vip" placeholder="Tìm kiếm theo mã thiết bị, tên, tình trạng hoặc người duyệt..." onkeyup="filterHistory()">
            </div>
            <div class="border-start ps-3">
                <span class="text-muted small fw-bold">TỔNG BẢN GHI: <span id="recordCount" class="text-primary" th:text="${#lists.size(history)}">0</span></span>
            </div>
        </div>

        <!-- TABLE -->
        <div class="history-card-vip animate__animated animate__fadeInUp">
            <div class="table-responsive">
                <table class="table table-hover mb-0 smart-table align-middle" id="historyTableVip">
                    <thead>
                        <tr>
                            <th class="ps-4" style="white-space: nowrap; width: 12%;">Ngày ghi nhận</th>
                            <th style="white-space: nowrap; width: 12%;">Mã thiết bị</th>
                            <th style="white-space: nowrap; width: 20%;">Tên tài sản</th>
                            <th style="white-space: nowrap; width: 10%;">Tình trạng</th>
                            <th style="width: 31%;">Mô tả sự cố</th>
                            <th class="text-end pe-4" style="white-space: nowrap; width: 15%;">Người duyệt</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${history}" class="history-row"
                            th:attr="data-id=${log.id},
                                     data-reported-at=${log.reported_at},
                                     data-device-code=${log.devices?.device_code},
                                     data-device-name=${log.devices?.device_name},
                                     data-status=${log.status},
                                     data-desc=${log.description},
                                     data-note=${log.note},
                                     data-user=${log.users?.full_name},
                                     data-resolver=${log.resolver?.full_name}"
                            onclick="showLogDetailsVip(this)">
                            <td class="ps-4" style="white-space: nowrap;">
                                <div class="fw-bold text-dark small format-date" th:text="${log.reported_at}">Date</div>
                            </td>
                            <td style="white-space: nowrap;"><span class="badge bg-light text-primary border fw-bold px-2 py-1 rounded" style="font-family: var(--font-mono); font-size: 0.75rem;" th:text="${log.devices?.device_code ?: 'N/A'}">CODE</span></td>
                            <td style="white-space: nowrap;">
                                <div class="fw-bold text-dark" th:text="${log.devices?.device_name ?: 'Thiết bị đã xóa'}">Tên tài sản</div>
                                <div th:if="${log.devices == null}" class="text-danger x-small fw-bold"><i class="fas fa-exclamation-circle me-1"></i>Dữ liệu gốc đã mất</div>
                            </td>
                            <td style="white-space: nowrap;">
                                <span class="history-badge-vip" 
                                      th:classappend="${log.status == 'Tốt' ? 'bg-status-tot' : (log.status == 'Hỏng' ? 'bg-status-hong' : (log.status == 'Đang bảo trì' ? 'bg-status-dangbaotri' : 'bg-status-baotri'))}"
                                      th:text="${log.status}">Status</span>
                            </td>
                            <td>
                                <div class="text-muted small italic text-truncate" style="max-width: 300px;" th:text="${log.description ?: 'Không có mô tả'}">Desc</div>
                            </td>
                            <td class="text-end pe-4" style="white-space: nowrap;">
                                <div class="d-flex justify-content-end align-items-center gap-2">
                                    <div class="avatar-mini-vip" th:text="${#strings.substring(log.resolver?.full_name ?: 'A', 0, 1)}">A</div>
                                    <span class="small fw-bold text-dark" th:text="${log.resolver?.full_name ?: 'Admin'}">Admin</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(history)}">
                            <td colspan="6" class="text-center py-5">
                                <div class="py-5">
                                    <div class="mb-3 opacity-20"><i class="fas fa-folder-open fa-4x"></i></div>
                                    <h5 class="fw-bold text-muted">Lịch sử hiện tại đang trống</h5>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function filterHistory() {
            const val = document.getElementById('historySearch').value.toLowerCase();
            const rows = document.querySelectorAll('#historyTableVip tbody tr');
            let visibleCount = 0;
            rows.forEach(r => {
                const isVisible = r.innerText.toLowerCase().includes(val);
                r.style.display = isVisible ? '' : 'none';
                if (isVisible) visibleCount++;
            });
            document.getElementById('recordCount').innerText = visibleCount;
        }

        function showLogDetailsVip(row) {
            const d = row.dataset;
            const formatDateFull = (dateStr) => {
                if (!dateStr || dateStr === 'undefined') return 'N/A';
                const date = new Date(dateStr);
                return isNaN(date.getTime()) ? dateStr : date.toLocaleString('vi-VN', {timeZone: 'Asia/Ho_Chi_Minh'});
            };

            Swal.fire({
                title: `<div class="fw-bold" style="font-family: 'Space Mono'">CHI TIẾT BẢN GHI #${d.id}</div>`,
                html: `
                    <div class="text-start p-3" style="font-size: 0.9rem; font-family:'Inter'">
                        <div class="mb-3 p-3 rounded-4 bg-light border">
                            <div class="x-small text-muted fw-bold text-uppercase mb-1">Thời gian báo cáo</div>
                            <div class="fw-bold text-dark">${formatDateFull(d.reportedAt)}</div>
                        </div>
                        <div class="mb-3 p-3 rounded-4 bg-light border">
                            <div class="x-small text-muted fw-bold text-uppercase mb-1">Tài sản hệ thống</div>
                            <div class="fw-bold text-primary">${(d.deviceName && d.deviceName !== 'undefined') ? d.deviceName : 'Thiết bị đã xóa'} <span class="badge bg-white text-primary ms-2 border">${(d.deviceCode && d.deviceCode !== 'undefined') ? d.deviceCode : 'N/A'}</span></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="p-3 rounded-4 bg-light border">
                                    <div class="x-small text-muted fw-bold text-uppercase mb-1">Trạng thái</div>
                                    <span class="badge bg-primary px-3 py-2 rounded-pill">${d.status}</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 rounded-4 bg-light border">
                                    <div class="x-small text-muted fw-bold text-uppercase mb-1">Người duyệt</div>
                                    <div class="fw-bold text-dark">${d.resolver || 'Admin'}</div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3 p-3 rounded-4 bg-light border">
                            <div class="x-small text-muted fw-bold text-uppercase mb-1">Mô tả sự cố</div>
                            <div class="text-muted small italic">${d.desc || 'N/A'}</div>
                        </div>
                        <div class="p-3 rounded-4 bg-light border">
                            <div class="x-small text-muted fw-bold text-uppercase mb-1">Ghi chú xử lý (Admin)</div>
                            <div class="fw-bold text-indigo">${d.note || 'Không có ghi chú thêm'}</div>
                        </div>
                    </div>
                `,
                confirmButtonText: 'ĐÓNG CỬA SỔ',
                confirmButtonColor: '#0f766e',
                buttonsStyling: false,
                customClass: {
                    confirmButton: 'btn btn-primary rounded-pill px-5 fw-bold py-3 w-100',
                    popup: 'modal-vip shadow-floating'
                }
            });
        }

        function exportHistoryExcel() {
            const rows = document.querySelectorAll('#historyTableVip tbody tr');
            const data = [];
            data.push(["ID", "Ngày ghi nhận", "Mã thiết bị", "Tên thiết bị", "Tình trạng", "Mô tả sự cố", "Ghi chú Admin", "Người báo cáo", "Người phê duyệt"]);
            rows.forEach(row => {
                if (row.style.display !== 'none') {
                    const d = row.dataset;
                    const reportDate = new Date(d.reportedAt);
                    const formattedDate = isNaN(reportDate.getTime()) ? d.reportedAt : reportDate.toLocaleString('vi-VN', {timeZone: 'Asia/Ho_Chi_Minh'});
                    data.push([ d.id, formattedDate, d.deviceCode, d.deviceName, d.status, d.desc || "---", d.note || "---", d.user || "---", d.resolver || "Admin" ]);
                }
            });
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LichSuBaoHong");
            XLSX.writeFile(wb, `LichSu_SuCo_${new Date().getTime()}.xlsx`);
        }
    </script>
</div>
