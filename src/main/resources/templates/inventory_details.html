<div th:fragment="content">
    <style>
        /* ===== VIP PRO INVENTORY DETAILS V2 ===== */
        .detail-wrapper {
            animation: detailFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: var(--text-main);
        }

        @keyframes detailFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: inline-flex; align-items: center; gap: 12px;
            color: #64748b; text-decoration: none; font-weight: 800;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px;
            transition: all 0.3s; margin-bottom: 24px; padding: 8px 16px;
            background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .back-link:hover { color: var(--primary); transform: translateX(-5px); background: #fff; border-color: var(--primary); }

        .glass-title-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(248,250,252,0.8) 100%);
            backdrop-filter: blur(20px); border-radius: 32px; padding: 40px;
            border: var(--glass-border); margin-bottom: 30px; box-shadow: var(--shadow-md);
        }

        .glass-title-card h2 {
            font-family: var(--font-display); font-weight: 800;
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1px; font-size: 2rem;
        }

        .search-container-vip {
            background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding: 24px;
            border: var(--glass-border); margin-bottom: 30px; box-shadow: var(--shadow-sm);
        }

        .input-vip {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 16px 24px; color: var(--text-main); font-weight: 600; width: 100%;
            transition: all 0.3s;
        }
        .input-vip:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,118,110,0.1); outline: none; }

        /* Table */
        .table-container-vip {
            background: #ffffff; border-radius: 28px; border: var(--glass-border);
            overflow: hidden; box-shadow: var(--shadow-md);
        }
        .table-vip thead th {
            background: #f8fafc; color: #64748b; font-weight: 800;
            text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;
            padding: 24px; border-bottom: 1px solid #e2e8f0;
        }
        .table-vip tbody td { padding: 24px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .table-vip tbody tr:hover { background: #f8fafc; }

        .status-pill-vip {
            padding: 8px 16px; border-radius: 12px; font-weight: 800; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 8px;
        }
        .pill-done { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .pill-warn { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }

        .badge-id-vip { background: #f1f5f9; color: #475569; padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 0.65rem; border: 1px solid #e2e8f0; }

        .btn-utility {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px;
            padding: 10px 20px; font-weight: 800; font-size: 0.75rem; color: #64748b;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-utility:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--primary); color: var(--primary); }
    </style>

    <div class="detail-wrapper">
        <a th:href="@{/inventory/progress(month=${selectedMonth}, year=${selectedYear})}" class="back-link">
            <i class="fas fa-chevron-left"></i> Danh sách phòng
        </a>

        <div class="glass-title-card d-flex justify-content-between align-items-center flex-wrap gap-4">
            <div>
                <h2 class="m-0">Phòng: <span th:text="${roomName}"></span></h2>
                <p class="text-muted mb-0 fw-medium mt-1">Kỳ kiểm kê: Tháng [[${selectedMonth}]]/[[${selectedYear}]]</p>
            </div>
            
            <div class="d-flex gap-3">
                <button class="btn-utility" onclick="window.print()"><i class="fas fa-print"></i> In danh sách</button>
                <a th:href="@{/inventory/export-room/{id}(id=${roomId ?: id}, roomName=${roomName}, month=${selectedMonth}, year=${selectedYear})}" 
                   class="btn-utility" style="color: #15803d; border-color: #bbf7d0;">
                    <i class="fas fa-file-excel"></i> Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-container-vip">
            <div class="position-relative">
                <i class="fas fa-search position-absolute top-50 translate-middle-y ms-4 text-muted"></i>
                <input type="text" class="input-vip ps-5" id="deviceSearch" placeholder="Tìm tên thiết bị, mã QR hoặc ID...">
            </div>
        </div>

        <div class="table-container-vip">
            <div class="table-responsive">
                <table class="table table-vip mb-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-5">Thiết bị</th>
                            <th>Mã QR</th>
                            <th>Hệ thống ID</th>
                            <th>Trạng thái máy</th>
                            <th>Cập nhật cuối</th>
                            <th class="text-center">Kết quả</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryDetailTable">
                        <tr th:each="d : ${details}">
                            <td class="ps-5">
                                <div class="fw-bold text-dark" th:text="${d.device_name}"></div>
                            </td>
                            <td><span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-bold" th:text="${d.device_code}"></span></td>
                            <td><span class="badge-id-vip">#[[${d.id}]]</span></td>
                            <td>
                                <span th:with="s=${d.status}" 
                                      th:class="'status-badge-vip ' + (${s == 'Tốt' ? 'badge-done' : 'badge-pending'})"
                                      th:text="${s}"></span>
                            </td>
                            <td>
                                <div class="text-muted small" th:if="${d.last_check != null}">
                                    <i class="far fa-clock me-1"></i> <span class="format-date-full" th:text="${d.last_check}"></span>
                                </div>
                                <div class="text-danger small fw-bold" th:unless="${d.last_check != null}">
                                    <i class="fas fa-times me-1"></i> Chưa quét
                                </div>
                            </td>
                            <td class="text-center">
                                <span th:class="'status-pill-vip ' + (${d.is_checked} ? 'pill-done' : 'pill-warn')">
                                    <i th:class="${d.is_checked} ? 'fas fa-check-circle' : 'fas fa-times-circle'"></i>
                                    [[${d.is_checked} ? 'Đã kiểm' : 'Chưa kiểm']]
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('deviceSearch')?.addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#inventoryDetailTable tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(val) ? '' : 'none';
            });
        });
    </script>
</div>
