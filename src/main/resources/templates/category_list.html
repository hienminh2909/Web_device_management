<div th:fragment="content" class="animate__animated animate__fadeIn">
    <style>
        /* ===== VIP PRO CATEGORY LIST V2 ===== */
        .category-wrapper {
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-family: var(--font-body);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Header & Stats --- */
        .header-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(248,250,252,0.7) 100%);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 40px;
            margin-bottom: 30px;
            border: var(--glass-border);
            box-shadow: var(--shadow-md);
        }

        .category-stat-pill {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        /* --- Search Area --- */
        .search-area-vip {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 15px 25px;
            margin-bottom: 35px;
            border: var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow-sm);
        }

        .search-input-vip {
            background: transparent !important;
            border: none !important;
            font-weight: 600 !important;
            font-size: 1rem !important;
            color: var(--text-main) !important;
            padding: 10px 0 !important;
        }
        .search-input-vip:focus { outline: none; box-shadow: none !important; }

        /* --- Category Cards --- */
        .category-card-vip {
            background: #ffffff;
            border-radius: 28px;
            padding: 30px;
            border: 1px solid #eef2f6;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .category-card-vip:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border-color: var(--primary-light);
        }

        .category-card-vip::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(15,118,110,0.03) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .category-card-vip:hover::after { opacity: 1; }

        .cat-icon-container {
            width: 64px; height: 64px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin-bottom: 20px;
            background: #f1f5f9; color: var(--primary);
            transition: all 0.3s;
        }
        .category-card-vip:hover .cat-icon-container {
            background: var(--primary-gradient);
            color: #ffffff;
            transform: scale(1.1) rotate(-5deg);
        }

        .cat-code-badge {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            padding: 4px 12px; border-radius: 8px; letter-spacing: 1px;
            background: var(--primary-light); color: var(--primary);
        }

        .cat-device-count {
            background: #f0fdf4; color: #15803d;
            padding: 6px 16px; border-radius: 12px;
            font-weight: 800; font-family: var(--font-mono);
        }

        /* --- Actions --- */
        .cat-action-group {
            display: flex; gap: 8px; opacity: 0; transform: translateX(10px);
            transition: all 0.3s;
        }
        .category-card-vip:hover .cat-action-group { opacity: 1; transform: translateX(0); }

        .btn-cat-action {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #e2e8f0; background: #fff; color: #64748b;
            transition: all 0.2s;
        }
        .btn-cat-action:hover { background: #f8fafc; color: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
        .btn-cat-delete:hover { color: var(--danger); border-color: var(--danger); background: #fff1f2; }

        .btn-add-main {
            background: var(--primary-gradient); color: #fff;
            padding: 12px 28px; border-radius: 16px; border: none;
            font-weight: 800; font-size: 0.9rem; letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.2);
            transition: all 0.3s;
        }
        .btn-add-main:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 25px rgba(15, 118, 110, 0.3); color: #fff; }

        /* Modal Custom */
        .modal-vip { border-radius: 32px !important; overflow: hidden; border: none !important; }
        .modal-vip .modal-header { background: var(--primary-gradient); color: #fff; padding: 30px; border: none; }
        .modal-vip .modal-body { padding: 40px; }
        .modal-vip .form-label { font-weight: 700; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .modal-vip .form-control { border-radius: 14px; padding: 12px 18px; border: 1px solid #e2e8f0; background: #f8fafc; transition: all 0.3s; }
        .modal-vip .form-control:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    </style>

    <div class="category-wrapper container-fluid p-0 pb-5">
        
        <!-- TOP HEADER & STATS -->
        <div class="header-glass d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
            <div>
                <h2 class="fw-bold mb-1" style="font-family: var(--font-display); letter-spacing: -1.5px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">QUẢN LÝ DANH MỤC</h2>
                <p class="text-muted fw-semibold small m-0">Thiết lập cấu trúc phân loại tài sản chuyên nghiệp.</p>
            </div>
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="category-stat-pill">
                    <div style="color: var(--primary); font-size: 1.2rem;"><i class="fas fa-layer-group"></i></div>
                    <div>
                        <div class="small text-muted fw-bold" style="font-size: 0.6rem; text-transform: uppercase;">Tổng số</div>
                        <div class="fw-bold" style="line-height: 1;" th:text="${#lists.size(categories)}">0</div>
                    </div>
                </div>
                <button class="btn btn-add-main" data-bs-toggle="modal" data-bs-target="#categoryModal" id="btnAddCategory">
                    <i class="fas fa-plus-circle me-2"></i> THÊM DANH MỤC
                </button>
            </div>
        </div>

        <!-- MODERN SEARCH BAR -->
        <div class="search-area-vip animate__animated animate__fadeIn">
            <i class="fas fa-search text-muted fs-5 ms-2"></i>
            <input type="text" id="categorySearchInput" class="form-control search-input-vip" placeholder="Tìm nhanh theo tên, mã hoặc mô tả danh mục...">
            <div class="d-none d-md-block border-start ps-3 ms-auto">
                <span class="text-muted small fw-bold">NHẤN <kbd class="bg-light text-dark border">ENTER</kbd> ĐỂ TÌM KIẾM</span>
            </div>
        </div>

        <!-- CATEGORIES GRID -->
        <div class="row g-4" id="categoryGrid">
            <div th:each="c : ${categories}" class="col-xl-4 col-lg-6 category-item animate__animated animate__zoomIn" 
                 th:data-id="${c.id}" 
                 th:data-name="${c.category_name}" 
                 th:data-code="${c.category_code}"
                 th:data-desc="${c.description}">
                <div class="category-card-vip">
                    <!-- Card Top: Icon & Actions -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="cat-icon-container">
                            <i class="fas fa-cubes"></i>
                        </div>
                        <div class="cat-action-group">
                            <button class="btn-cat-action btn-edit-category" title="Chỉnh sửa"><i class="fas fa-pen"></i></button>
                            <button class="btn-cat-action btn-cat-delete btn-delete-category" title="Xóa"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>

                    <!-- Card Body: Info -->
                    <div class="mb-4">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="cat-code-badge" th:text="${c.category_code}">CODE</span>
                            <span class="small text-muted fw-bold">ID: #<span th:text="${c.id}">0</span></span>
                        </div>
                        <h4 class="fw-bold mb-2 category-name-text" th:text="${c.category_name}" style="letter-spacing: -0.5px;">Tên Danh Mục</h4>
                        <p class="text-muted small mb-0 category-desc-text line-clamp-2" th:text="${c.description ?: 'Chưa có mô tả chi tiết cho nhóm thiết bị này.'}" style="min-height: 40px;">Mô tả...</p>
                    </div>

                    <!-- Card Bottom: Stats & Links -->
                    <div class="mt-auto pt-4 border-top d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <div class="cat-device-count" th:text="${c.device_count}">0</div>
                            <span class="small text-muted fw-bold">Thiết bị</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/devices/list(categoryId=${c.id}, categoryName=${c.category_name})}" 
                               class="btn btn-link btn-sm text-decoration-none p-0 fw-bold transition-all" style="color: var(--primary);">
                                CHI TIẾT <i class="fas fa-chevron-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EMPTY STATE -->
            <div th:if="${#lists.isEmpty(categories)}" class="col-12 text-center py-5 animate__animated animate__fadeIn">
                <div class="py-5 bg-white rounded-5 shadow-sm border border-2 border-dashed">
                    <div class="mb-4 text-muted opacity-25">
                        <i class="fas fa-folder-plus fa-5x"></i>
                    </div>
                    <h3 class="fw-bold">Hệ thống đang trống</h3>
                    <p class="text-muted mb-4">Hãy bắt đầu bằng cách khởi tạo danh mục thiết bị đầu tiên.</p>
                    <button class="btn btn-add-main px-5 py-3" data-bs-toggle="modal" data-bs-target="#categoryModal">
                        <i class="fas fa-plus me-2"></i> TẠO DANH MỤC NGAY
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PREMIUM CATEGORY MODAL -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-vip shadow-floating">
                <div class="modal-header">
                    <div class="d-flex align-items-center gap-3">
                        <div style="width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-layer-group fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title fw-bold" id="categoryModalLabel">Thêm Danh Mục Mới</h5>
                            <div class="small opacity-75">Cung cấp thông tin nhóm thiết bị</div>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId">
                        <div class="row g-4">
                            <div class="col-12">
                                <label class="form-label">Tên danh mục hiển thị</label>
                                <input type="text" id="categoryName" class="form-control" required placeholder="Ví dụ: Máy tính xách tay, Màn hình LCD...">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Mã định danh hệ thống</label>
                                <input type="text" id="categoryCode" class="form-control" required placeholder="Ví dụ: LAPTOP, MONITOR...">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Mô tả chi tiết nhóm thiết bị</label>
                                <textarea id="categoryDescription" class="form-control" rows="4" placeholder="Ghi chú về các đặc điểm hoặc quy trình quản lý của nhóm này..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">ĐÓNG</button>
                    <button type="button" id="btnSaveCategory" class="btn btn-add-main px-5" onclick="window.saveCategory()">LƯU DỮ LIỆU</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            console.log(">>> CATEGORY V2 JS: INITIALIZING");

            window.saveCategory = async function() {
                const id = document.getElementById('categoryId').value;
                const isEdit = id !== '';
                const btn = document.getElementById('btnSaveCategory');
                
                const categoryData = {
                    category_name: document.getElementById('categoryName').value.trim(),
                    category_code: document.getElementById('categoryCode').value.trim(),
                    description: document.getElementById('categoryDescription').value.trim() || null
                };

                if (!categoryData.category_name || !categoryData.category_code) {
                    Swal.fire('Cảnh báo', 'Vui lòng nhập đầy đủ Tên và Mã danh mục!', 'warning');
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> ĐANG XỬ LÝ...';

                    const url = isEdit ? `categories/${id}` : 'categories/add';
                    const method = isEdit ? 'PUT' : 'POST';
                    
                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(categoryData)
                    });

                    const rawRes = await response.text();
                    if (response.ok) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Thành công!',
                            text: isEdit ? 'Đã cập nhật danh mục.' : 'Đã thêm danh mục mới.',
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => location.reload());
                    } else {
                        Swal.fire('Thất bại', `Lỗi: ${rawRes}`, 'error');
                    }
                } catch (err) {
                    Swal.fire('Lỗi kết nối', 'Không thể đồng bộ với máy chủ', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'LƯU DỮ LIỆU';
                }
            };

            window.openEditCategoryModal = function(data) {
                document.getElementById('categoryModalLabel').innerText = 'Cập Nhật Danh Mục';
                document.getElementById('categoryId').value = data.id;
                document.getElementById('categoryName').value = data.name;
                document.getElementById('categoryCode').value = data.code || '';
                document.getElementById('categoryDescription').value = data.desc || '';
                const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
                modal.show();
            };

            window.confirmDeleteCategory = function(id) {
                Swal.fire({
                    title: 'Xác nhận xóa?',
                    text: "Bạn sắp xóa vĩnh viễn danh mục này khỏi hệ thống!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    confirmButtonText: 'ĐÚNG, XÓA NGAY',
                    cancelButtonText: 'HỦY BỎ'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        try {
                            const response = await fetch(`categories/${id}`, { method: 'DELETE' });
                            if (response.ok) {
                                Swal.fire('Đã xóa!', '', 'success').then(() => location.reload());
                            } else {
                                throw new Error('Lỗi từ server');
                            }
                        } catch (e) { Swal.fire('Lỗi', e.message, 'error'); }
                    }
                });
            };

            document.addEventListener('DOMContentLoaded', function() {
                const searchInput = document.getElementById('categorySearchInput');
                const categoryGrid = document.getElementById('categoryGrid');
                
                searchInput?.addEventListener('input', function() {
                    const term = this.value.toLowerCase().trim();
                    document.querySelectorAll('.category-item').forEach(item => {
                        const name = item.getAttribute('data-name').toLowerCase();
                        const code = item.getAttribute('data-code').toLowerCase();
                        item.style.display = (name.includes(term) || code.includes(term)) ? '' : 'none';
                    });
                });

                categoryGrid?.addEventListener('click', (e) => {
                    const editBtn = e.target.closest('.btn-edit-category');
                    const deleteBtn = e.target.closest('.btn-delete-category');
                    const row = e.target.closest('.category-item');
                    
                    if (editBtn && row) {
                        window.openEditCategoryModal({
                            id: row.getAttribute('data-id'),
                            name: row.getAttribute('data-name'),
                            code: row.getAttribute('data-code'),
                            desc: row.getAttribute('data-desc')
                        });
                    } else if (deleteBtn && row) {
                        window.confirmDeleteCategory(row.getAttribute('data-id'));
                    }
                });

                document.getElementById('categoryModal')?.addEventListener('show.bs.modal', function (e) {
                    if (e.relatedTarget?.id === 'btnAddCategory') {
                        document.getElementById('categoryModalLabel').innerText = 'Thêm Danh Mục Mới';
                        document.getElementById('categoryForm').reset();
                        document.getElementById('categoryId').value = '';
                    }
                });
            });
        })();
    </script>
</div>
