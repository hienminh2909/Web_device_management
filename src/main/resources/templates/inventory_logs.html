<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">Lịch Sử Quét Mã</h2>
            <p class="text-muted mb-0 small">Theo dõi lịch sử kiểm kê thiết bị bằng máy quét</p>
        </div>
    </div>
    <div class="bg-white p-4 rounded-4 shadow-sm border-0">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Thời gian quét</th>
                    <th>Tên thiết bị</th>
                    <th>Mã định danh (Code)</th>
                    <th>Trạng thái lúc quét</th>
                    <th>Thiết bị quét (Handheld)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#strings.replace(log.inventory_at, 'T', ' ').substring(0, 19)}"></td>
                    <td class="fw-bold text-primary" th:text="${log.devices?.device_name}"></td>
                    <td th:text="${log.devices?.device_code}"></td>
                    <td>
                        <span class="badge rounded-pill" 
                              th:classappend="${log.status_at_scan == 'Tốt' ? 'bg-success' : 'bg-warning'}"
                              th:text="${log.status_at_scan}">
                        </span>
                    </td>
                    <td th:text="${log.handheld_name ?: 'Web/App'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có dữ liệu kiểm kê</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
