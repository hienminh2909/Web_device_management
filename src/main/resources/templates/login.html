<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | HCM-UTE.EQUIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-surface: #f8fafc;
            --primary: #0f766e;
            --primary-gradient: linear-gradient(135deg, #0f766e, #0d9488);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --font-body: 'Inter', sans-serif;
            --font-display: 'Space Mono', monospace;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg-surface);
            font-family: var(--font-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(15, 118, 110, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(15, 118, 110, 0.05), transparent 40%);
            z-index: -1;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: var(--shadow-card);
            border: var(--glass-border);
            backdrop-filter: blur(20px);
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header { margin-bottom: 40px; text-align: center; }
        
        .brand-logo-container {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 2rem;
        }

        .brand-title {
            font-family: var(--font-display);
            font-weight: 800; font-size: 2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; letter-spacing: -1px;
        }

        .brand-subtitle {
            color: var(--text-muted); font-size: 0.85rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; margin-top: 5px;
        }

        .form-label {
            font-size: 0.75rem; font-weight: 800; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; display: block; padding-left: 5px;
        }

        .input-group-vip { margin-bottom: 24px; }

        .form-control {
            background: #f8fafc !important;
            border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 1rem 1.25rem; color: var(--text-main) !important;
            font-weight: 600; font-family: var(--font-body);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            background: #ffffff !important;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
            outline: none;
        }

        .btn-vip {
            background: var(--primary-gradient);
            color: #ffffff; border: none; border-radius: 16px;
            padding: 16px; font-weight: 800; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s; width: 100%;
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.25);
            font-family: var(--font-body); margin-top: 10px;
        }

        .btn-vip:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(15, 118, 110, 0.35); }

        .alert-error {
            background: #fff1f2; color: #e11d48;
            border: 1px solid #fecdd3; border-radius: 12px;
            padding: 12px; font-size: 0.8rem; font-weight: 700;
            margin-bottom: 20px; text-align: center;
        }

        .forgot-link {
            display: inline-block; margin-top: 25px;
            color: var(--text-muted); text-decoration: none;
            font-size: 0.85rem; font-weight: 700; transition: all 0.2s;
        }
        .forgot-link:hover { color: var(--primary); }

        @media (max-width: 480px) {
            body {
                padding: 10px 0;
                align-items: flex-start;
            }
            .login-wrapper {
                padding: 10px;
            }
            .glass-card {
                padding: 35px 24px;
                border-radius: 24px;
            }
            .brand-title {
                font-size: 1.8rem !important;
            }
            .brand-logo-container {
                width: 90px !important;
                height: 90px !important;
                border-radius: 24px !important;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="glass-card">
        <div class="brand-header">
            <div class="brand-logo-container" style="width: 110px; height: 110px; background: white; border-radius: 32px; box-shadow: 0 16px 32px rgba(15, 118, 110, 0.15); border: 2px solid rgba(15, 118, 110, 0.08); padding: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; transition: transform 0.3s ease;">
                <img src="/images/logo.png" style="width: 100%; height: 100%; object-fit: contain;" alt="HCM-UTE Logo" />
            </div>
            <div class="text-center">
                <h6 style="font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.5px; color: #64748b; text-transform: uppercase; margin-bottom: 6px;">ĐH Sư phạm Kỹ thuật TP.HCM</h6>
                <h1 class="brand-title" style="font-family: 'Inter', sans-serif; font-weight: 900; font-size: 2.2rem; line-height: 1.2; background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 2px 10px rgba(15, 118, 110, 0.05); margin: 0 0 12px 0; letter-spacing: -1px; text-transform: uppercase;">HCM-UTE.EQUIP</h1>
                <div class="d-inline-block px-3 py-1.5 fw-bold" style="background: rgba(15, 118, 110, 0.08); border: 1px solid rgba(15, 118, 110, 0.15); color: #0f766e; border-radius: 99px; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Inter', sans-serif; box-shadow: 0 2px 5px rgba(15, 118, 110, 0.02); padding: 6px 16px;">
                    Hệ thống Quản lý Thiết bị
                </div>
            </div>
        </div>

        <div th:if="${error}" class="alert-error">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/do-login}" method="post" onsubmit="return handleLoginSubmit(this)">
            <div class="input-group-vip">
                <label class="form-label">Tên tài khoản</label>
                <input type="text" name="user" class="form-control" placeholder="Nhập username" required autofocus>
            </div>

            <div class="input-group-vip">
                <label class="form-label">Mật mã</label>
                <input type="password" name="pass" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-vip">
                XÁC THỰC <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="text-center">
            <a href="/forgot-password" class="forgot-link">QUÊN MẬT MÃ?</a>
        </div>
    </div>
</div>

<script>
    function handleLoginSubmit(form) {
        const btn = form.querySelector('.btn-vip');
        btn.style.opacity = '0.85';
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 1rem; height: 1rem; vertical-align: middle;"></span> ĐANG KẾT NỐI MÁY CHỦ...';
        return true;
    }
</script>

</body>
</html>
