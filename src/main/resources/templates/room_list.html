<div th:fragment="content">
    <style>
        :root {
            --room-primary: #0ea5e9;
            --room-secondary: #6366f1;
            --room-bg: #f8fafc;
            --room-card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .room-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            border-radius: 1.25rem;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .room-icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-right: 1rem;
        }

        .action-btn-room {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            transition: all 0.2s;
        }

        .action-btn-room:hover {
            background: #e2e8f0;
            color: var(--room-primary);
        }

        .action-btn-delete:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .search-container-room {
            position: relative;
            max-width: 400px;
        }

        .search-container-room i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-container-room input {
            padding-left: 45px;
            border-radius: 50px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.3s;
        }

        .search-container-room input:focus {
            border-color: var(--room-primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .btn-add-vip {
            background: linear-gradient(135deg, var(--room-primary), var(--room-secondary));
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.4);
        }

        .btn-add-vip:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.5);
            color: white;
        }
    </style>

    <!-- HEADER & SEARCH -->
    <div class="row align-items-center g-3 mb-5 animate__animated animate__fadeIn">
        <div class="col-md-4">
            <h2 class="fw-bold m-0 text-dark">Quản Lý Phòng</h2>
            <p class="text-muted mb-0 small">Hệ thống phân bổ & quản lý vị trí thiết bị</p>
        </div>
        <div class="col-md-5">
            <div class="search-container-room">
                <i class="fas fa-search"></i>
                <input type="text" id="roomSearchInput" class="form-control" placeholder="Tìm kiếm tên phòng hoặc mô tả...">
            </div>
        </div>
        <div class="col-md-3 text-md-end">
            <button class="btn btn-add-vip shadow-sm ms-auto" id="btnAddRoom" data-bs-toggle="modal" data-bs-target="#roomModal">
                <i class="fas fa-plus-circle"></i> Thêm Phòng Mới
            </button>
        </div>
    </div>

    <!-- ROOMS GRID -->
    <div class="row g-4" id="roomGrid">
        <div th:each="r : ${rooms}" class="col-xl-4 col-md-6 room-item animate__animated animate__zoomIn" 
             th:data-id="${r.id}" 
             th:data-name="${r.room_name}" 
             th:data-desc="${r.description}">
            <div class="room-card p-4 h-100 d-flex flex-column shadow-sm">
                <div class="d-flex align-items-start justify-content-between mb-3">
                    <div class="d-flex align-items-center">
                        <div class="room-icon-box" style="background: #f0f9ff; color: #0ea5e9;">
                            <i class="fas fa-door-open"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold text-dark mb-0 room-name-text" th:text="${r.room_name}">Tên Phòng</h5>
                            <small class="text-muted">ID: <span class="fw-bold text-primary" th:text="${r.id}">001</span></small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="action-btn-room btn-edit-room" title="Chỉnh sửa">
                            <i class="fas fa-pen small"></i>
                        </button>
                        <button class="action-btn-room action-btn-delete btn-delete-room" title="Xóa">
                            <i class="fas fa-trash-alt small"></i>
                        </button>
                    </div>
                </div>
                <div class="flex-grow-1">
                    <p class="text-muted small mb-3 room-desc-text" th:text="${r.description ?: 'Không có mô tả cho phòng này.'}">Mô tả phòng...</p>
                    <div class="d-flex align-items-center mb-2">
                        <i class="fas fa-hdd text-muted me-2 small"></i>
                        <span class="small text-muted">Thiết bị hiện có: </span>
                        <span class="ms-2 badge rounded-pill bg-info-subtle text-info fw-bold" th:text="${r.device_count}">0</span>
                    </div>
                </div>
                <div class="mt-auto pt-3 border-top d-flex justify-content-end">
                    <a th:href="@{/devices/list(roomId=${r.id}, roomName=${r.room_name})}" 
                       class="btn btn-link btn-sm text-decoration-none p-0 fw-bold transition-all" 
                       style="color: var(--room-primary);">
                        Quản lý thiết bị <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(rooms)}" class="col-12 text-center py-5 animate__animated animate__fadeIn">
            <div class="py-5 bg-white rounded-4 shadow-sm border border-dashed">
                <div class="mb-4">
                    <i class="fas fa-door-closed fa-4x text-muted opacity-25"></i>
                </div>
                <h4 class="fw-bold text-dark">Chưa có phòng nào</h4>
                <p class="text-muted">Hãy bắt đầu bằng việc tạo phòng học hoặc kho chứa mới.</p>
                <button class="btn btn-add-vip mx-auto" data-bs-toggle="modal" data-bs-target="#roomModal">
                    Tạo phòng đầu tiên
                </button>
            </div>
        </div>
    </div>

    <!-- ROOM MODAL -->
    <div class="modal fade" id="roomModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header border-0 text-white p-4" style="background: linear-gradient(135deg, var(--room-primary), var(--room-secondary));">
                    <h5 class="modal-title fw-bold" id="roomModalLabel"><i class="fas fa-plus-circle me-2"></i>Thêm Phòng Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="roomForm" onsubmit="event.preventDefault(); window.saveRoom(); return false;">
                        <input type="hidden" id="roomId">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted text-uppercase">Tên Phòng Học / Kho <span class="text-danger">*</span></label>
                                <input type="text" id="roomName" class="form-control rounded-3 border-light bg-light py-2" required placeholder="Ví dụ: Phòng 402, Kho A...">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-muted text-uppercase">Ghi chú / Mô tả</label>
                                <textarea id="roomDescription" class="form-control rounded-3 border-light bg-light" rows="4" placeholder="Nhập ghi chú chi tiết về phòng này..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" id="btnSaveRoom" class="btn btn-primary rounded-pill px-5 fw-bold" onclick="window.saveRoom()" style="background: var(--room-primary); border: none;">Lưu Thông Tin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- INLINE JS FOR ROOMS -->
    <script>
        console.log(">>> ROOM JS: LOADED");

        window.saveRoom = async function() {
            console.log(">>> ROOM JS: saveRoom() START");
            const id = document.getElementById('roomId').value;
            const isEdit = id !== '';
            const btn = document.getElementById('btnSaveRoom');
            
            const roomData = {
                room_name: document.getElementById('roomName').value.trim(),
                description: document.getElementById('roomDescription').value.trim() || null
            };

            if (!roomData.room_name) {
                Swal.fire('Cảnh báo', 'Vui lòng nhập tên phòng!', 'warning');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang xử lý...';

                const url = isEdit ? `rooms/${id}` : 'rooms/add';
                const method = isEdit ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomData)
                });

                const rawRes = await response.text();
                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: isEdit ? 'Đã cập nhật!' : 'Đã thêm mới!',
                        text: 'Dữ liệu phòng đã được đồng bộ.',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => location.reload());
                } else {
                    let errorMsg = rawRes;
                    try {
                        const json = JSON.parse(rawRes);
                        errorMsg = json.error || json.detail || json.message || rawRes;
                    } catch(e) {}
                    Swal.fire('Thất bại', `Lỗi: ${errorMsg}`, 'error');
                }
            } catch (err) {
                Swal.fire('Lỗi kết nối', 'Không thể kết nối đến máy chủ', 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Lưu Thông Tin';
                }
            }
        };

        window.openEditRoomModal = function(data) {
            document.getElementById('roomModalLabel').innerHTML = '<i class="fas fa-edit me-2"></i>Chỉnh Sửa Thông Tin Phòng';
            document.getElementById('roomId').value = data.id;
            document.getElementById('roomName').value = data.name;
            document.getElementById('roomDescription').value = data.desc || '';
            const modal = new bootstrap.Modal(document.getElementById('roomModal'));
            modal.show();
        };

        window.confirmDeleteRoom = function(id) {
            Swal.fire({
                title: 'Xóa phòng?',
                text: "Lưu ý: Bạn chỉ có thể xóa phòng trống (không có thiết bị).",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Đúng, xóa nó!',
                cancelButtonText: 'Hủy',
                showLoaderOnConfirm: true,
                preConfirm: async () => {
                    try {
                        const response = await fetch(`rooms/${id}`, { method: 'DELETE' });
                        const rawRes = await response.text();
                        if (!response.ok) {
                            let errorMsg = rawRes;
                            try {
                                const json = JSON.parse(rawRes);
                                errorMsg = json.error || json.detail || json.message || rawRes;
                            } catch(e) {}
                            throw new Error(errorMsg);
                        }
                        return true;
                    } catch (error) {
                        Swal.showValidationMessage(`Lỗi: ${error.message}`);
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đã xóa!',
                        text: 'Phòng đã được loại bỏ thành công.',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => location.reload());
                }
            });
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log(">>> ROOM DOM READY");
            const searchInput = document.getElementById('roomSearchInput');
            const roomGrid = document.getElementById('roomGrid');
            
            if (!roomGrid) return;

            searchInput?.addEventListener('input', function() {
                const term = this.value.toLowerCase().trim();
                const items = document.querySelectorAll('.room-item');
                items.forEach(item => {
                    const name = item.getAttribute('data-name').toLowerCase();
                    const desc = (item.getAttribute('data-desc') || '').toLowerCase();
                    item.style.display = (name.includes(term) || desc.includes(term)) ? '' : 'none';
                });
            });

            roomGrid.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.btn-edit-room');
                const deleteBtn = e.target.closest('.btn-delete-room');
                const row = e.target.closest('.room-item');
                
                if (editBtn && row) {
                    window.openEditRoomModal({
                        id: row.getAttribute('data-id'),
                        name: row.getAttribute('data-name'),
                        desc: row.getAttribute('data-desc')
                    });
                } else if (deleteBtn && row) {
                    window.confirmDeleteRoom(row.getAttribute('data-id'));
                }
            });

            const modalEl = document.getElementById('roomModal');
            modalEl?.addEventListener('show.bs.modal', function (e) {
                const trigger = e.relatedTarget;
                if (trigger && (trigger.id === 'btnAddRoom' || trigger.classList.contains('btn-add-vip'))) {
                    document.getElementById('roomModalLabel').innerHTML = '<i class="fas fa-plus-circle me-2"></i>Thêm Phòng Mới';
                    document.getElementById('roomForm').reset();
                    document.getElementById('roomId').value = '';
                }
            });
        });
    </script>
</div>
